name: CI/CD - Build, Scan, Push & Deploy

on:
  push:
    branches:
      - dev
      - sandbox
      - main

permissions:
  contents: write

jobs:
  semver:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump-semver.outputs.new_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Latest Tag (global)
        id: get-latest-tag
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --sort=-v:refname | head -n1)
          echo "Latest tag is $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Set Initial Version if No Tags Exist
        id: set-initial-version
        run: |
          if [ -z "${{ steps.get-latest-tag.outputs.tag }}" ]; then
            echo "No tags found, setting initial version to v1.0.0"
            echo "current_version=v1.0.0" >> $GITHUB_ENV
          else
            echo "current_version=${{ steps.get-latest-tag.outputs.tag }}" >> $GITHUB_ENV
          fi

      - name: Ensure Version is at Least v1.0.0
        id: ensure-minimum-version
        run: |
          current_version=${{ env.current_version }}
          if [ "$(printf '%s\n' "$current_version" "v1.0.0" | sort -V | head -n1)" = "$current_version" ] && [ "$current_version" != "v1.0.0" ]; then
            echo "current_version=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Determine Version Bump Type
        id: determine-bump-type
        run: |
          echo "level=patch" >> $GITHUB_ENV
          if git log -1 --pretty=%B | grep -q 'bump: major'; then
            echo "level=major" >> $GITHUB_ENV
          elif git log -1 --pretty=%B | grep -q 'bump: minor'; then
            echo "level=minor" >> $GITHUB_ENV
          fi

      - name: Bump SemVer
        id: bump-semver
        uses: actions-ecosystem/action-bump-semver@v1
        with:
          current_version: ${{ env.current_version }}
          level: ${{ env.level }}

      - name: Check if Tag Exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/${{ steps.bump-semver.outputs.new_version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_ENV
          else
            echo "tag_exists=false" >> $GITHUB_ENV
          fi

      - name: Push New Tag
        if: env.tag_exists == 'false'
        uses: actions-ecosystem/action-push-tag@v1
        with:
          tag: ${{ steps.bump-semver.outputs.new_version }}
          message: "Release ${{ steps.bump-semver.outputs.new_version }}"